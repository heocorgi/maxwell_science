<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101e35">
  <meta name="description" content="맥스웰 과학 — 재미가 이해로, 이해가 실력으로. 중등·고등 과학 수업과 학습 상담.">
  <title>맥스웰 과학 | 재미가 이해로, 이해가 실력으로</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root{--navy:#101e35;--navy2:#1b2d49;--teal:#117f99;--gold:#c49a56;--kakao:#FEE500;--kakao-ink:#191919;--paper:#f7f7f4;--ink:#19283d;--muted:#718096;--line:#e4e8ec;--white:#fff;--shadow:0 18px 52px rgba(16,30,53,.09);--max:1160px}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:88px}body{margin:0;color:var(--ink);background:var(--white);font-family:"DM Sans","Noto Sans KR",sans-serif;line-height:1.7;word-break:keep-all}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}.container{width:min(var(--max),calc(100% - 44px));margin:auto}.section{padding:96px 0}.soft{background:var(--paper)}.eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--teal);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.eyebrow:before{content:"";width:22px;height:1px;background:var(--gold)}h1,h2,h3,p{margin-top:0}.heading{margin-bottom:35px}.heading h2{margin:10px 0;color:var(--navy);font-size:clamp(29px,4vw,43px);line-height:1.3;letter-spacing:-.045em}.heading p{margin-bottom:0;color:var(--muted)}
    
    /* 헤더 및 상단 로고 */

    .nav{height:78px;display:flex;align-items:center;justify-content:space-between;gap:24px}

    .nav-links{display:flex;align-items:center;gap:28px;margin:0;padding:0;list-style:none}
    .nav-links a{font-size:13px;font-weight:700;color:#4e5d70;transition:.2s}
    .nav-links a:hover,.nav-links a.current{color:var(--teal)}
    
    /* 버튼 공통 및 카카오톡 버튼 스타일 */
    .nav-cta,.button{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 18px;border:1px solid transparent;border-radius:8px;background:var(--navy);color:white;font-size:13px;font-weight:800;cursor:pointer;transition:.2s}
    .nav-cta:hover,.button:hover{background:var(--teal);transform:translateY(-1px)}
    .button.outline{border-color:var(--line);background:#fff;color:var(--navy)}
    .button.outline:hover{border-color:var(--teal);color:var(--teal);background:#fff}
    .button.kakao,.nav-cta.kakao{background:var(--kakao);color:var(--kakao-ink);border-color:rgba(0,0,0,.06)}
    .button.kakao:hover,.nav-cta.kakao:hover{background:#f5dc00;color:#000;transform:translateY(-1px)}
    .hamb{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy)}

    /* 메인 히어로 배너: 포스터 배경 없이 깔끔한 남색-틸 그라데이션 유지 */
    .hero{position:relative;overflow:hidden;min-height:570px;display:flex;align-items:center;background:linear-gradient(110deg,#0d1a2f 0%,#112b42 58%,#104152 100%);color:white}
    .hero:after{content:"";position:absolute;right:-140px;top:-200px;width:600px;height:600px;border:1px solid rgba(196,154,86,.28);border-radius:50%;box-shadow:0 0 0 42px rgba(196,154,86,.05),0 0 0 90px rgba(196,154,86,.035);pointer-events:none}
    .hero-content{position:relative;z-index:1;max-width:720px;padding:78px 0}.hero .eyebrow{color:#dfbd82}.hero h1{margin:20px 0 17px;font-size:clamp(43px,6.6vw,76px);line-height:1.16;letter-spacing:-.06em}.hero h1 em{font-style:normal;color:#73c0d0}.hero p{max-width:590px;margin-bottom:28px;color:rgba(255,255,255,.77);font-size:17px}.hero-notice{display:inline-flex;align-items:center;gap:10px;margin-bottom:22px;padding:10px 16px;border:1px solid rgba(223,189,130,.4);border-radius:8px;background:rgba(16,30,53,.65);color:#f3dfb9;font-size:13px;font-weight:600}.hero-actions{display:flex;flex-wrap:wrap;gap:12px}.hero .button{padding:14px 20px;background:var(--gold);color:#102039}.hero .button.outline{border-color:rgba(255,255,255,.35);background:transparent;color:white}.hero-meta{display:flex;gap:21px;flex-wrap:wrap;margin-top:28px;color:rgba(255,255,255,.72);font-size:12px}.hero-meta i{margin-right:6px;color:#77c7d0}
    
    .about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:55px;align-items:center}.about-copy h2{margin:12px 0 18px;font-size:clamp(31px,4vw,47px);line-height:1.32;letter-spacing:-.05em;color:var(--navy)}.about-copy p{color:var(--muted)}.quote{margin-top:24px;padding:16px 19px;border-left:3px solid var(--gold);background:#f7f6f1;color:var(--navy2);font-weight:700}.pillars{display:grid;grid-template-columns:1fr 1fr;gap:13px}.pillar{padding:22px 20px;border:1px solid var(--line);border-radius:12px;background:#fff;transition:.2s}.pillar:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.pillar i{color:var(--teal);font-size:18px}.pillar h3{margin:13px 0 5px;font-size:15px;color:var(--navy)}.pillar p{margin:0;color:var(--muted);font-size:12px}
    .location{display:grid;grid-template-columns:.78fr 1.22fr;gap:22px;margin-top:36px;padding:22px;border:1px solid var(--line);border-radius:14px;background:#fff}.location-info{padding:8px}.location-info h3{margin:5px 0 13px;color:var(--navy);font-size:19px}.location-info p{display:flex;gap:10px;margin:9px 0;color:#617086;font-size:13px}.location-info i{width:17px;margin-top:5px;color:var(--teal)}.map-frame{min-height:260px;overflow:hidden;border-radius:10px;background:#edf1f5}.map-frame iframe{display:block;width:100%;height:100%;min-height:260px;border:0}
    .teacher-grid{display:grid;grid-template-columns:.85fr 1.15fr;max-width:870px;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:white;box-shadow:var(--shadow)}.teacher-photo{min-height:360px;background:#1b263e}.teacher-photo img{display:block;width:100%;height:100%;min-height:360px;object-fit:cover;object-position:54% 20%}.teacher-info{align-self:center;padding:38px}.teacher-info .role{display:inline-block;padding:5px 10px;border-radius:5px;background:#e8f4f5;color:var(--teal);font-size:11px;font-weight:800}.teacher-info h3{margin:14px 0 18px;color:var(--navy);font-size:33px;line-height:1.2}.teacher-info ul{margin:0;padding:0;list-style:none}.teacher-info li{position:relative;margin:11px 0;padding-left:20px;color:#59697f;font-size:14px}.teacher-info li:before{content:"";position:absolute;left:0;top:11px;width:6px;height:6px;border-radius:50%;background:var(--gold)}.teacher-motto{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);color:var(--navy);font-size:14px;font-weight:800}
    .reviews{display:grid;grid-template-columns:1fr 1fr;gap:15px}.review{padding:20px 22px;border:1px solid var(--line);border-radius:11px;background:#fff}.review .stars{color:var(--gold);font-size:12px;letter-spacing:2px}.review blockquote{margin:10px 0 13px;color:#55647a;font-size:13px}.review small{color:var(--muted);font-size:11px}.review-note{margin-top:16px;color:#8a94a1;font-size:11px}
    .cta{padding:57px 0;background:var(--navy);color:white}.cta-inner{display:flex;align-items:center;justify-content:space-between;gap:28px}.cta h2{margin:0 0 6px;font-size:clamp(24px,3vw,34px);letter-spacing:-.04em}.cta p{margin:0;color:rgba(255,255,255,.68);font-size:13px}.cta-buttons{display:flex;gap:10px;flex-wrap:wrap}
    
    /* 푸터 및 하단 로고 */
    .footer{padding:32px 0;background:#0c1728;color:#9eacbf}
    .footer-inner{display:flex;align-items:center;justify-content:space-between;gap:24px}
    .footer img{display:block;width:140px;height:54px;object-fit:contain;object-position:left center}
    .footer-info{font-size:11px}.footer-info p{margin:2px 0}.footer-info a{color:#fff}.copy{font-size:10px;display:flex;align-items:center;gap:12px}.admin-trigger{color:#6a7b91;font-size:11px;cursor:pointer;border:1px solid rgba(255,255,255,.15);padding:3px 8px;border-radius:5px;background:transparent}.admin-trigger:hover{color:#fff;border-color:#fff}

    /* 우측 하단 고정 카카오톡 플로팅 버튼 */
    .floating-kakao{position:fixed;right:24px;bottom:24px;z-index:40;display:inline-flex;align-items:center;gap:8px;padding:13px 18px;border-radius:50px;background:var(--kakao);color:var(--kakao-ink);font-size:13px;font-weight:800;box-shadow:0 10px 28px rgba(16,30,53,.22);transition:.2s}
    .floating-kakao:hover{transform:translateY(-3px);background:#f5dc00}

    /* PC용 전화번호 안내 토스트 모달 */
    .toast-popup{position:fixed;bottom:84px;right:24px;z-index:60;display:none;padding:16px 20px;border-radius:12px;background:var(--navy);color:#fff;font-size:13px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.15)}
    .toast-popup.show{display:block;animation:fadeIn .2s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    .view{display:none;min-height:70vh}.view.active{display:block}.page-hero{padding:74px 0 62px;color:#fff;background:linear-gradient(110deg,#101e35,#155d70)}.page-hero h1{margin:11px 0;font-size:clamp(35px,5vw,54px);letter-spacing:-.05em}.page-hero p{max-width:600px;margin:0;color:rgba(255,255,255,.72)}.schedule-box{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:white}.schedule-table{width:100%;min-width:650px;border-collapse:collapse}.schedule-table th,.schedule-table td{padding:17px 18px;border-bottom:1px solid var(--line);text-align:left}.schedule-table th{background:#f2f6f7;color:#566579;font-size:12px}.schedule-table td{font-size:13px;color:#4d5b6e}.schedule-table tr:last-child td{border-bottom:0}.schedule-table td:first-child,.schedule-table td:nth-child(3){font-weight:800;color:var(--navy)}.tag{display:inline-block;padding:5px 9px;border-radius:5px;background:#e7f2f4;color:#16788e;font-size:11px;font-weight:800}.tag.gold{background:#fbf3e7;color:#9b7134}.notice{margin-top:15px;color:var(--muted);font-size:12px}.poster-link{display:inline-flex;margin-top:24px;align-items:center;gap:8px;color:var(--teal);font-size:13px;font-weight:800}
    .science-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px}.science-card{min-height:232px;display:flex;flex-direction:column;justify-content:space-between;padding:23px;border:1px solid var(--line);border-radius:12px;background:white;transition:.2s;cursor:pointer}.science-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.science-card.featured{border:0;color:#fff;background:linear-gradient(145deg,#123b56,#12819a)}.science-meta{color:var(--muted);font-size:11px}.science-card.featured .science-meta{color:rgba(255,255,255,.7)}.science-meta span{margin-right:8px;color:var(--teal);font-weight:800}.science-card.featured .science-meta span{color:#f0cb8d}.science-card h3{margin:22px 0 9px;color:var(--navy);font-size:19px;line-height:1.45}.science-card.featured h3{color:#fff}.science-card p{margin:0;color:var(--muted);font-size:12px}.science-card.featured p{color:rgba(255,255,255,.75)}.science-card .read-more{margin-top:18px;color:var(--teal);font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:6px}.science-card.featured .read-more{color:#f2d69f}.empty-news{grid-column:1/-1;padding:42px;text-align:center;border:1px dashed #cad4dd;border-radius:12px;color:var(--muted)}.empty-news i{display:block;margin-bottom:12px;color:var(--teal);font-size:25px}
    .modal-backdrop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(16,30,53,.65);backdrop-filter:blur(4px)}.modal-backdrop.open{display:flex}.modal-box{width:min(680px,100%);max-height:85vh;overflow-y:auto;padding:34px;border-radius:16px;background:#fff;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}.modal-close{border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;cursor:pointer;color:var(--navy)}.modal-body{color:var(--ink);font-size:15px;line-height:1.8;white-space:pre-line}
    .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.admin-card{padding:26px;border:1px solid var(--line);border-radius:14px;background:#fff}.admin-card.full{grid-column:1/-1}.admin-card h3{margin-bottom:14px;color:var(--navy);font-size:18px;display:flex;align-items:center;gap:8px}.form-row{margin-bottom:12px}.form-row label{display:block;margin-bottom:5px;font-size:12px;font-weight:700;color:var(--navy2)}.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px}.form-row textarea{min-height:95px;resize:vertical}.item-list{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;max-height:240px;overflow-y:auto}.item-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}.item-row button{padding:4px 9px;border:1px solid #e53e3e;border-radius:5px;background:#fff;color:#e53e3e;font-size:11px;cursor:pointer}.code-Export{width:100%;height:180px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#0f172a;color:#e2e8f0;font-family:monospace;font-size:12px}
    @media(max-width:850px){.nav-links{gap:15px}.nav-links a{font-size:12px}.nav-cta{padding:10px 12px;font-size:12px}.about-grid{gap:30px}.location{grid-template-columns:1fr 1.2fr}.science-grid,.admin-grid{grid-template-columns:1fr 1fr}.science-card.featured{grid-column:1/-1}}
    @media(max-width:660px){html{scroll-padding-top:70px}.container{width:calc(100% - 34px)}.nav{height:68px}.brand img{width:130px;height:50px}.hamb{display:block}.nav-cta{display:none}.nav-links{position:absolute;display:none;top:67px;left:0;right:0;align-items:stretch;gap:0;padding:8px 20px 14px;background:white;border-bottom:1px solid var(--line);box-shadow:0 14px 24px rgba(16,30,53,.09)}.nav-links.open{display:flex;flex-direction:column}.nav-links a{display:block;padding:10px 0;font-size:14px}.hero{min-height:500px}.hero-content{padding:66px 0}.hero h1{font-size:clamp(39px,11vw,57px)}.hero p{font-size:15px}.section{padding:70px 0}.about-grid,.location,.teacher-grid,.reviews,.science-grid,.admin-grid{grid-template-columns:1fr}.pillars{gap:9px}.pillar{padding:17px 15px}.location{padding:15px}.map-frame,.map-frame iframe{min-height:230px}.teacher-photo{min-height:320px;max-height:420px}.teacher-photo img{min-height:320px;max-height:420px;object-position:54% 17%}.teacher-info{padding:26px}.cta-inner,.footer-inner{align-items:flex-start;flex-direction:column}.cta-buttons,.cta .button{width:100%}.footer-info{line-height:1.7}.science-card.featured{grid-column:auto}.page-hero{padding:58px 0 48px}.floating-kakao{right:16px;bottom:16px;padding:11px 15px;font-size:12px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="header">
    <nav class="nav container" aria-label="주요 메뉴">

        <img id="headerLogo" src="assets/logo.png" alt="MAXWELL SCIENCE">
      </a>
      <button class="hamb" id="menuButton" aria-label="메뉴 열기" aria-expanded="false"><i class="fa-solid fa-bars"></i></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="#about" data-scroll="about">학원 소개</a></li>
        <li><a href="#teacher" data-scroll="teacher">선생님</a>
